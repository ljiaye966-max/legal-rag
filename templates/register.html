<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>手机号注册 - AI 法律案例推理系统</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="login-page">
      <section class="login-hero">
        <h1>手机号注册</h1>
        <p>使用手机号和验证码创建普通用户账户。注册成功后可使用手机号或系统账户名登录。</p>
        {% if sms_demo_mode %}
        <span class="badge amber">本地演示验证码</span>
        {% else %}
        <span class="badge">短信认证已启用</span>
        {% endif %}
      </section>
      <section class="card">
        <h2>创建账户</h2>
        {% if sms_demo_mode %}
        <p class="muted">本地演示模式下，验证码会显示在页面提示中。</p>
        {% else %}
        <p class="muted">验证码将发送到填写的手机号，平台不会向本页面返回验证码。</p>
        {% endif %}
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post" action="/register">
          <label>手机号</label>
          <input id="phone" name="phone" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" required>
          <div class="actions">
            <button class="secondary" type="button" id="send-code">获取验证码</button>
            <span class="muted" id="code-status"></span>
          </div>
          <label>验证码</label>
          <input name="verification_code" inputmode="numeric" maxlength="6" placeholder="请输入 6 位验证码" required>
          <label>显示名称（可选）</label>
          <input name="display_name" maxlength="80" placeholder="例如：张同学">
          <label>登录密码</label>
          <input name="password" type="password" minlength="6" placeholder="至少 6 位" required>
          <div class="actions">
            <button type="submit">注册并登录</button>
            <a class="button secondary" href="/login">返回登录</a>
          </div>
        </form>
      </section>
    </main>
    <script>
      const button = document.getElementById("send-code");
      const phone = document.getElementById("phone");
      const status = document.getElementById("code-status");
      button.addEventListener("click", async () => {
        try {
          const response = await fetch("/api/auth/send-code", {
            method: "POST",
            headers: {"content-type": "application/json"},
            body: JSON.stringify({phone: phone.value, purpose: "register"})
          });
          const payload = await response.json();
          if (!response.ok || payload.code !== 0) {
            throw new Error(payload.message || "验证码发送失败");
          }
          status.textContent = payload.data.demo_code
            ? `演示验证码：${payload.data.demo_code}`
            : "验证码已发送，请注意查收短信。";
        } catch (error) {
          status.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
